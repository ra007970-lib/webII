<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Programa Controle de Velocidade.</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-3">
                <img src="imagens/velocimetro.png" alt="imagens de um velocimetro." class="img-fluid">
            </div>

            <div class="col-9">
                <h1>Programa Controle de Velocidade</h1>
                <hr>

                <form action="">
                    <p>Velocidade Permitida:
                        <input type="number" id="inVelocidadePermitida" required>
                    </p>
                    <p> Velocidade do condutor:
                        <input type="number" id="inVelocidadeCondutor" required>

                    </p>
                    <input type="submit" value="Verificar Velocidade" class="btn btn-primary">
                </form>
                <h3></h3>

            </div>
        </div>
    </div>
    <script src="js/exercicio02.js"></script>
</body>
</html>
