<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante JS</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1>Restaurante JS</h1>
                <form action="">
                    <p>Buffet por Quilo R$: 
                        <input type="number" id="inQuilo" min="0" step="0.10">
                    </p>
                    <p>Consumo por Cliente (gr):
                        <input type="number" id="inConsumo" min="0" required>
                    </p>
                    <input type="submit" value="Calcular Preço." id="btn btn-warning">

                </form>
                <h3></h3>
            </div>
        </div>
    </div>
    <script src="js/ex04.js"></script>
    
</body>
</html>
