<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia JS</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1>Farmacia JS</h1>

                <form action="">
                    <p>Medicamento:
                        <input type="text" id ="inMedicamento" required>


                    </p>

                    <p>Preço R$: 
                        <input type="number" id="inPreco" min="0" step="0.01" required>
                    </p>

                    <input type="submit" value="Mostrar Promoção.">
                </form>
                <h3 id="outResp1"></h3>
                <h3 id="outResp2"></h3>
            </div>
        </div>
    </div>
    <script src="farmacia.js"></script>
</body>
</html>
